name: Android APK

# Builds an installable APK on every push to main (and on demand),
# then publishes it on the "latest" GitHub release so anyone can download it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/popote-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: popote-apk
          path: dist/*.apk

      - name: Publish on the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --title "Popote ${VERSION} (Android)" \
            --notes "APK Android construit automatiquement depuis le commit ${GITHUB_SHA::7}. Téléchargez le fichier .apk sur votre téléphone, ouvrez-le et autorisez l'installation. / Android APK built from commit ${GITHUB_SHA::7}." \
            --latest
