name: Web app (iPhone, iPad, ordinateur)

# Publishes the installable web version on GitHub Pages:
# https://<user>.github.io/<repo>/  — on iPhone, open it in Safari, then Share → "Sur l'écran d'accueil".
# The build is pushed to the gh-pages branch (Settings > Pages > Source: "Deploy from a branch", gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve from /<repo>/
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.experiments={...a.expo.experiments,baseUrl:'/${{ github.event.repository.name }}'};fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - run: npx expo export --platform web
      - run: node scripts/pwa.mjs dist /${{ github.event.repository.name }}
      - run: touch dist/.nojekyll
      - name: Push the site to gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web app from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
